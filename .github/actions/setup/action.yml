name: Setup
description: Node, pnpm and the project's dependencies.

runs:
  using: composite
  steps:
    # No version here on purpose: the action reads `packageManager` from
    # package.json, so the pnpm the CI uses is the pnpm the repository pins.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    # Same idea for Node: `.nvmrc` is what a contributor's `nvm use` reads, so
    # CI and a laptop cannot drift apart. pnpm must already be on PATH for the
    # cache to be able to resolve the store.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # `--frozen-lockfile` is the point of running this in CI: it fails rather
    # than silently resolving a dependency the lockfile does not describe.
    - run: pnpm install --frozen-lockfile
      shell: bash
